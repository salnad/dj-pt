[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djpt"
version = "0.1.0"
description = "Audio-to-Strudel analysis, rendering, and optimization harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "OpenAI Cursor" }
]
dependencies = [
  "librosa>=0.11.0",
  "numpy>=2.2.0",
  "openai>=1.68.2",
  "pydantic>=2.11.0",
  "python-dotenv>=1.0.1",
  "scipy>=1.15.0",
  "soundfile>=0.13.1",
  "typer>=0.15.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]
promptopt = [
  "dspy-ai>=3.1.3",
]
embeddings = [
  "openl3>=0.4.2",
]

[project.scripts]
djpt = "djpt.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
